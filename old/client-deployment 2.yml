apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  labels:
    component: client
spec:
  replicas: 1  # High availability across your nodes
  selector:
    matchLabels:
      component: client
  template:
    metadata:
      labels:
        component: client
    spec:
      containers:
        - name: client
          image: chaheein123/udemykubes-client:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000  # Matches your Dockerfile EXPOSE port
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          # Health checks to ensure traffic only hits healthy Nginx containers
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 3000
          #   initialDelaySeconds: 5
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 3000
          #   initialDelaySeconds: 10
          #   periodSeconds: 15